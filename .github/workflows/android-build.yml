name: Build Ratkogram APKs

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build ${{ matrix.name }} APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v8
            abi_filters: '"arm64-v8a"'
            artifact: Ratkogram-Phantom-Pulse-v8-debug
          - name: v7
            abi_filters: '"armeabi-v7a"'
            artifact: Ratkogram-Phantom-Pulse-v7-debug
          - name: universal
            abi_filters: '"armeabi-v7a", "arm64-v8a"'
            artifact: Ratkogram-Phantom-Pulse-universal-mobile-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set ABI filters
        run: |
          perl -0pi -e 's/abiFilters\s+[^\n]+/abiFilters $ENV{ABI_FILTERS}/g' TMessagesProj/build.gradle TMessagesProj_App/build.gradle
          grep -n "abiFilters" TMessagesProj/build.gradle TMessagesProj_App/build.gradle
        env:
          ABI_FILTERS: ${{ matrix.abi_filters }}

      - name: Build APK
        run: ./gradlew -p . :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp TMessagesProj_App/build/outputs/apk/afat/debug/app.apk "artifacts/${{ matrix.artifact }}.apk"

      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}-${{ matrix.name }}
        run: |
          gh release create "$TAG" "artifacts/${{ matrix.artifact }}.apk" \
            --draft --title "Ratkogram 12.10.3 debug ($TAG)" \
            --notes "Automated debug build from master @ ${GITHUB_SHA}" \
          || gh release upload "$TAG" "artifacts/${{ matrix.artifact }}.apk" --clobber

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.apk
          if-no-files-found: warn
